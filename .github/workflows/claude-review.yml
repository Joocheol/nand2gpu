name: Claude manuscript critical review through chapter 4

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .github/workflows/claude-review.yml
      - chapters/prologue.tex
      - chapters/chapter01.tex
      - chapters/chapter02.tex
      - chapters/chapter03.tex
      - chapters/chapter04.tex
      - figures/preface-01-equation-and-finite-machine.tex
      - figures/preface-02-down-and-up-map.tex
      - figures/ch01-01-rule-to-truth-table.tex
      - figures/ch01-02-specification-vs-implementation.tex
      - figures/ch02-01-one-function-two-decompositions.tex
      - figures/ch03-01-two-faces-of-bits.tex
      - figures/ch03-02-four-bit-addition.tex
      - figures/ch04-01-carry-through-four-bits.tex
      - figures/ch04-02-chain-vs-expanded.tex
      - main.tex
      - references.bib
      - scripts/check-figure-invariants.py
      - tests/ch04-02-standalone.tex

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: claude-manuscript-critical-review-through-chapter-4
  cancel-in-progress: false

jobs:
  build-review-input:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ghcr.io/joocheol/latex-book-ci@sha256:e09de48df329e11b1a8f453a04fc60ee162861ff7a7accefb3d7a6d61d7688a9
    permissions:
      contents: read
    steps:
      - name: Check out review target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Trust checked-out workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install verified KoPubWorld review fonts
        run: |
          set -o pipefail
          apt-get update
          apt-get install --no-install-recommends -y \
            curl \
            poppler-utils \
            unzip
          archive="$(mktemp)"
          extract_dir="$(mktemp -d)"
          curl --fail --location --retry 3 \
            'https://www.kopus.org/wp-content/uploads/2021/03/KOPUBWORLD_OTF_FONTS.zip' \
            --output "$archive"
          echo \
            "3a996824770d59381f6ada17f2b1d4c1923637c237ee701b112b863c846ad4de  $archive" \
            | sha256sum --check
          unzip -q "$archive" -d "$extract_dir"
          mkdir -p fonts
          find "$extract_dir" -type f -iname '*.otf' -exec cp '{}' fonts/ \;
          sha256sum --check <<'SHA256'
          e7b2e5ab08d0d39b5a09417a1970fd8e0d7fd5464821339accd40aa61583b4dd  fonts/KoPubWorld Batang_Pro Bold.otf
          895fdc6de0ff0fe24b1a63ae16601c174c810b24daa23ade78115b7e134c4c0a  fonts/KoPubWorld Batang_Pro Light.otf
          2d385ffbb351f41cbe82d981a0bc10315e01f4e113424a0ed1b7291a801479bb  fonts/KoPubWorld Batang_Pro Medium.otf
          650f21fd744674be266f7a40095fc8838a2c2fef05a3f4634362c022d2f81216  fonts/KoPubWorld Dotum_Pro Bold.otf
          529b2f02b96276d9209124a72181fcd7bfc656a567718670d0c3934f6c11adea  fonts/KoPubWorld Dotum_Pro Light.otf
          073a3426827351e393ba290a59a072aecd830a5daf2e9692828ca20f3d5ff4a0  fonts/KoPubWorld Dotum_Pro Medium.otf
          SHA256

      - name: Validate and build review PDF
        run: |
          set -o pipefail
          bash scripts/validate.sh
          bash scripts/build.sh
          bash scripts/build-figure-test.sh
          test -s main.pdf
          test -s .build/ch04-02-standalone.pdf
          mkdir -p .ai-review-input
          cp main.pdf .ai-review-input/main.pdf
          file .ai-review-input/main.pdf .build/ch04-02-standalone.pdf

      - name: Render every review page
        run: |
          set -o pipefail
          apt-get update
          apt-get install --no-install-recommends -y \
            poppler-data \
            poppler-utils \
            python3-pil

          mkdir -p .ai-review-input/pages/main
          pdftoppm -png -r 180 -cropbox \
            .ai-review-input/main.pdf \
            .ai-review-input/pages/main/page

          find .ai-review-input/pages/main -type f -name 'page-*.png' \
            -printf '%p\n' | sort -V > .ai-review-input/page-index.txt

          pdf_pages="$(pdfinfo .ai-review-input/main.pdf | awk '/^Pages:/ { print $2 }')"
          rendered_pages="$(wc -l < .ai-review-input/page-index.txt | tr -d ' ')"
          test "$pdf_pages" -eq 40
          test "$rendered_pages" -eq "$pdf_pages"
          printf 'pdf_pages=%s\nrendered_pages=%s\n' \
            "$pdf_pages" "$rendered_pages" \
            > .ai-review-input/page-count.txt

          pdftotext -enc UTF-8 -layout \
            .ai-review-input/main.pdf \
            .ai-review-input/main.txt
          grep -Fq "같은 덧셈도 마지막 올림을 만드는 길은 다르다" \
            .ai-review-input/main.txt
          grep -Fq "1111" \
            .ai-review-input/main.txt
          grep -Fq "이번 장의 선택과 비용" \
            .ai-review-input/main.txt

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          pages = [
              Path(line)
              for line in Path('.ai-review-input/page-index.txt').read_text().splitlines()
              if line
          ]
          assert len(pages) == 40
          for page in pages:
              image = Image.open(page).convert('L')
              nonwhite = sum(pixel < 245 for pixel in image.getdata())
              print(f'{page}: nonwhite={nonwhite}')
              assert nonwhite > 1000, f'blank or unreadable render: {page}'
          PY

      - name: Upload bounded review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claude-chapter-4-review-input
          path: .ai-review-input/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  review:
    needs: build-review-input
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out reviewed sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Download rendered review evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: claude-chapter-4-review-input
          path: .ai-review-input

      - name: Critically review manuscript through chapter 4 with Claude
        id: claude
        uses: anthropics/claude-code-action@c038e4dcdedfbbca18dfb17df35a17e40ded4ddc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: |
            {
              "env": {
                "CLAUDE_CODE_MAX_OUTPUT_TOKENS": "48000"
              }
            }
          prompt: |
            You are an adversarial developmental editor and independent
            technical reviewer for the Korean general-audience mathematics,
            digital-computation, and GPU book "진리표에서 GPU까지". Review only.
            Do not edit, commit, push, label, or comment. Do not behave as a
            checklist certifier. Treat the manuscript as not yet publishable
            until its technical, pedagogical, structural, and visual choices
            survive serious challenge.

            Read editorial/review-checklist.md,
            planning/preface-part1-detailed-briefs.md,
            chapters/preface.tex, chapters/prologue.tex,
            chapters/chapter01.tex, chapters/chapter02.tex,
            chapters/chapter03.tex, chapters/chapter04.tex,
            every figure source included by those chapters,
            figures/ch04-01-carry-through-four-bits.tex,
            figures/ch04-02-chain-vs-expanded.tex, main.tex,
            references.bib, and research/source-register.md.

            Read .ai-review-input/page-count.txt and
            .ai-review-input/page-index.txt. Then use Read on every PNG listed
            in the index, in numeric order. The rendered pages, not source
            inspection alone, are the visual evidence. State the exact number
            of pages read and identify any unreadable page rather than claiming
            complete coverage.

            Before checking the supplied brief or arithmetic, independently
            reconstruct the manuscript's promise, conceptual dependency map,
            and chapter-by-chapter argument from the rendered book itself.
            Then test whether the current opening sequence actually earns the
            promised path from a human-readable equation through finite logic
            toward a GPU. Compliance with the planning brief is not evidence
            that the resulting book works.

            Conduct a critical whole-manuscript review through chapter 4:
            - Does the preface/prologue state a concrete reader promise, and do
              chapters 1--4 visibly advance it rather than repeatedly restating
              "same answer, different cost"?
            - Is the sequence truth table -> NAND -> number representation ->
              carry path necessary, cumulative, and paced for a reader with no
              programming or digital-logic background?
            - Identify prerequisite leakage, unexplained notation, sudden
              abstraction jumps, delayed payoffs, duplicated explanations,
              and sections or pages that could be removed without loss.
            - Test every chapter title and section title against what the text
              actually proves. Flag scope inflation, especially if a claim
              about "the same addition" is supported only by a c_4 comparison
              that excludes sum-output hardware.
            - Judge whether examples, equations, tables, and figures perform
              different teaching jobs. Flag figures that merely repeat prose,
              prose that decodes a figure too late, and dense formal passages
              that stop being general-audience exposition.
            - Examine whether the six-row "이번 장의 선택과 비용" device adds a
              new synthesis in each chapter or has become repetitive form.
            - Inspect cross-chapter consistency of units and boundaries:
              truth-table rows, NAND gates and NAND depth, bit width and value
              range, unit gates and carry-path depth, carry-out versus signed
              overflow, and one-adder gate paths versus later work/span.
            - Review full-page composition, not isolated figures: page turns,
              excessive blank areas, stranded tables, dense or undersized
              diagrams, header hierarchy, equation rhythm, and whether B5
              black-and-white pages invite continuous reading.
            - Check whether cited sources support the claims made, but do not
              spend the findings budget on minor citation ordering while more
              consequential structural or pedagogical defects remain.

            Apply explicit stress tests. Try to identify a defensible 15--20%
            cut with no loss of argument; locate the earliest page where a
            general reader is likely to stop; identify the weakest transition
            between chapters; and state which current section most needs
            restructuring rather than copyediting. If a stress test finds no
            defect, explain what evidence defeated the challenge.

            Independently verify the chapter's logic and arithmetic:
            - every p_i, g_i, c_i, and S_i value in
              1111_2 + 0001_2 = 1 0000_2;
            - p_i=A_i XOR B_i, g_i=A_i AND B_i, and
              c_(i+1)=g_i OR (p_i AND c_i);
            - the fully expanded c_4 expression, including all five terms;
            - ripple c_4 cost: eight p/g gates plus eight carry gates = 16,
              and depth 1 + four two-gate carry stages = 9;
            - expanded-lookahead c_4 cost: eight p/g gates, ten AND gates,
              and four OR gates = 22, with term depths 1,2,3,3,4,
              accumulation depths 3,4,5, and final c_4 depth 6;
            - all four carries expanded independently without sharing use
              38 gates, while 22 gates describes only the c_4 circuit;
            - both 16-versus-22 comparisons exclude sum-output hardware;
            - carry-out is not presented as a general signed-overflow signal;
            - a gate path inside one adder is kept distinct from chapter 8's
              work and span across many operations.

            For chapter 4 specifically, test whether generate, propagate, unit
            gate delay, ripple carry, and carry lookahead are introduced with
            enough intuition before the symbolic expansion; whether every
            intermediate value is useful rather than merely present; whether
            the 16-versus-22 comparison is fair and clearly bounded to c_4;
            whether the 38-gate caveat arrives early enough; and whether the
            chapter genuinely leads from addition to multiplication.

            Check both chapter 4 figures for correct arithmetic, readable
            black-and-white B5 layout, minimum text size, clipping, overlaps,
            line routing, arrowheads, and meaningful visual hierarchy. In
            Figure 4.1 confirm four bit boxes, right-to-left c_0 through c_4
            value flow, 1111_2+0001_2=1 0000_2, and the separation between the
            example's value flow and structural worst-case depth. In Figure 4.2
            confirm marker counts of ripple p/g 8 and carry 8, expanded p/g 8,
            AND 10, OR 4; the labels 16 gates/9 layers and 22 gates/6 layers;
            and unambiguous signal routing. Check the final "이번 장의 선택과
            비용" table for completeness and unit discipline.

            Write the review in Korean. Be skeptical, specific, and economical.
            Do not invent defects or inflate severity, but do not equate factual
            correctness with editorial readiness. Prefer root causes and
            consequential defects over harmless inconsistencies. Return at most
            15 findings, ordered by severity and expected reader harm. Each
            finding must identify location, problem, severity, category,
            evidence, a concrete recommendation, and risk if unchanged.
            Separate changes Codex can implement directly from structural or
            pedagogical decisions that require the author. Return at most five
            author questions, and ask one only when different answers would
            materially change the book. End with exactly one verdict: "현재
            상태로 사용 가능", "소폭 수정 후 사용 가능", or "재설계 필요".
          claude_args: >-
            --tools "Read,Grep,Glob"
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "mcp__*"
            --model claude-sonnet-5
            --max-turns 60
            --json-schema
            '{"type":"object","properties":{"pages_read":{"type":"integer","minimum":0},"summary":{"type":"string"},"architecture_verdict":{"type":"string"},"general_reader_verdict":{"type":"string"},"logic_verdict":{"type":"string"},"visual_verdict":{"type":"string"},"stress_test":{"type":"string"},"findings":{"type":"array","maxItems":15,"items":{"type":"object","properties":{"id":{"type":"string"},"location":{"type":"string"},"problem":{"type":"string"},"severity":{"type":"string","enum":["high","medium","low"]},"category":{"type":"string","enum":["technical","pedagogy","structure","visual","citation","prose"]},"action_owner":{"type":"string","enum":["codex","author"]},"evidence":{"type":"string"},"recommendation":{"type":"string"},"risk_if_unchanged":{"type":"string"}},"required":["id","location","problem","severity","category","action_owner","evidence","recommendation","risk_if_unchanged"],"additionalProperties":false}},"author_questions":{"type":"array","maxItems":5,"items":{"type":"object","properties":{"question":{"type":"string"},"why_it_matters":{"type":"string"},"options":{"type":"array","minItems":2,"maxItems":3,"items":{"type":"string"}}},"required":["question","why_it_matters","options"],"additionalProperties":false}},"final_verdict":{"type":"string","enum":["현재 상태로 사용 가능","소폭 수정 후 사용 가능","재설계 필요"]}},"required":["pages_read","summary","architecture_verdict","general_reader_verdict","logic_verdict","visual_verdict","stress_test","findings","author_questions","final_verdict"],"additionalProperties":false}'

      - name: Save structured Claude review
        env:
          CLAUDE_REVIEW: ${{ steps.claude.outputs.structured_output }}
        run: |
          test -n "$CLAUDE_REVIEW"
          printf '%s\n' "$CLAUDE_REVIEW" > claude-review.json
          {
            echo '## Claude manuscript critical review through chapter 4'
            echo '~~~json'
            cat claude-review.json
            echo '~~~'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Claude review result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claude-manuscript-critical-review-result
          path: claude-review.json
          if-no-files-found: error
          retention-days: 7
