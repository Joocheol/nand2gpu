name: Claude independent book review

on:
  workflow_dispatch:
  pull_request:
    types:
      - labeled

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: claude-independent-book-review
  cancel-in-progress: false

jobs:
  build-review-input:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'ai-review')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out review target
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Restore pinned review PDF
        run: |
          set -o pipefail
          mkdir -p .ai-review-input
          base64 --decode .github/review-snapshots/78cf921-main.pdf.b64 \
            > .ai-review-input/main.pdf
          sha256sum --check <<'SHA256'
          0b850626984adc63f925d280bac4ec95bf30ad131a419731e461478181e3b945  .ai-review-input/main.pdf
          SHA256

      - name: Render every review page
        run: |
          set -o pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            poppler-data \
            poppler-utils \
            python3-pil

          mkdir -p .ai-review-input/pages/main

          pdftoppm -png -r 180 -cropbox \
            .ai-review-input/main.pdf \
            .ai-review-input/pages/main/page

          find .ai-review-input/pages -type f -name 'page-*.png' \
            -printf '%p\n' | sort -V > .ai-review-input/page-index.txt

          main_pages="$(pdfinfo .ai-review-input/main.pdf | awk '/^Pages:/ { print $2 }')"
          rendered_pages="$(wc -l < .ai-review-input/page-index.txt | tr -d ' ')"
          test "$main_pages" -gt 0
          test "$rendered_pages" -eq "$main_pages"
          printf 'main_pages=%s\nrendered_pages=%s\n' \
            "$main_pages" "$rendered_pages" \
            > .ai-review-input/page-count.txt

          pdffonts .ai-review-input/main.pdf > .ai-review-input/font-report.txt
          grep -q 'KoPubWorldBatang' .ai-review-input/font-report.txt
          grep -q 'KoPubWorldDotum' .ai-review-input/font-report.txt

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          index = Path('.ai-review-input/page-index.txt')
          pages = [Path(line) for line in index.read_text().splitlines() if line]
          assert pages, 'no rendered pages'
          for page in pages:
              image = Image.open(page).convert('L')
              nonwhite = sum(pixel < 245 for pixel in image.getdata())
              print(f'{page}: nonwhite={nonwhite}')
              assert nonwhite > 1000, f'blank or unreadable render: {page}'
          PY

      - name: Upload bounded review evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claude-review-input
          path: .ai-review-input/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  review:
    needs: build-review-input
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out reviewed sources
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download rendered review evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: claude-review-input
          path: .ai-review-input

      - name: Review revised preface and prologue with Claude
        id: claude
        uses: anthropics/claude-code-action@c038e4dcdedfbbca18dfb17df35a17e40ded4ddc # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          settings: |
            {
              "env": {
                "CLAUDE_CODE_MAX_OUTPUT_TOKENS": "48000"
              }
            }
          prompt: |
            You are an independent technical editor and print reviewer for the Korean
            general-audience mathematics, digital-computation, and GPU book
            "진리표에서 GPU까지". Review only; do not edit, commit, push, label, or comment.

            The review target is exactly the checked-out commit. Read
            editorial/review-checklist.md, chapters/preface.tex, chapters/prologue.tex,
            main.tex, figures/README.md,
            illustrations/preface-part1/preface-01-equation-and-finite-machine.svg,
            planning/chapter-map.md, and planning/preface-part1-detailed-briefs.md.
            Read .ai-review-input/page-count.txt, .ai-review-input/font-report.txt, and
            .ai-review-input/page-index.txt. Then use Read on every PNG in the index in
            numeric order. The rendered PNGs, not source inspection alone, are the visual
            evidence. State the exact number of pages read and identify any unreadable page.

            Concentrate on the current revision:

            1. Assess whether the opening question is natural and precise for a general
               reader: a calculation that seems obvious to a person still requires choices
               when a computer executes it, and those choices have costs. Check the immediate
               following sentences for repetition, logical flow, and consistency with the
               rest of the prologue.
            2. Verify the 2x2 matrix example in the prologue, including A times B, all four
               results, and the worked calculation 1*5 + 2*7 = 19. Judge whether a reader
               without prior matrix instruction can follow the example from what is actually
               shown, without the text making a claim about whether the reader knows matrices.
            3. Check that the prose no longer depends on the opaque term "수학적 명세" and
               that its replacements preserve the intended distinction between a result rule
               and an execution plan.
            4. Assess the recurring heading "이번 장의 선택과 비용" in its present context.
               Check that it covers preserved result, computational requirements, machine
               resources, finite-precision changes, design tradeoffs, and remaining
               constraints, and that terminology is consistent across the source, figure
               metadata, and planning documents. Do not reopen the naming decision unless
               there is a concrete semantic or editorial defect.
            5. Inspect all nine rendered pages for KoPubWorld Korean glyph failures, tofu,
               missing characters, clipping, overlap, broken equations, awkward page breaks,
               headings, tables, diagrams, headers, footers, and B5 black-and-white
               legibility. Use font-report.txt only as supporting evidence; visible pages are
               decisive.

            Verify claims independently and do not invent findings when the current result is
            sound. Consolidate duplicate symptoms under one root cause. Return at most 12
            findings. Each finding must identify location, problem, severity, category,
            evidence, concrete recommendation, and risk if unchanged. Write the review in
            Korean and end with exactly one verdict: "현재 상태로 사용 가능",
            "소폭 수정 후 사용 가능", or "재설계 필요". Put the complete Korean
            review in the single structured-output string field named "review".
          claude_args: >-
            --tools "Read,Grep,Glob"
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "mcp__*"
            --model claude-sonnet-5
            --max-turns 60
            --json-schema
            '{"type":"object","properties":{"review":{"type":"string"}},"required":["review"],"additionalProperties":false}'

      - name: Save structured Claude review
        env:
          CLAUDE_REVIEW: ${{ steps.claude.outputs.structured_output }}
        run: |
          test -n "$CLAUDE_REVIEW"
          printf '%s\n' "$CLAUDE_REVIEW" > claude-review.json
          {
            echo '## Claude independent review'
            echo '```json'
            cat claude-review.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Claude review result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: claude-review-result
          path: claude-review.json
          if-no-files-found: error
          retention-days: 7
