<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker><style>.title{font:700 34px sans-serif;fill:#111}.sub{font:500 19px sans-serif;fill:#444}.label{font:700 21px sans-serif;fill:#111}.body{font:500 18px sans-serif;fill:#222}.small{font:500 15px sans-serif;fill:#555}.box{fill:#fff;stroke:#222;stroke-width:2}.shade{fill:#e9e9e9;stroke:#222;stroke-width:2}.dash{fill:#fff;stroke:#666;stroke-width:2;stroke-dasharray:9 7}.line{stroke:#222;stroke-width:3;fill:none}</style></defs>
  <rect width="1400" height="900" fill="#fff"/>
  <text x="70" y="72" class="title">진리표는 명세이고, 게이트 연결은 구현이다</text>
  <text x="70" y="106" class="sub">1장 도해 2 · 같은 AND 결과를 NAND 두 개로 만들기</text>

  <rect x="70" y="165" width="390" height="540" rx="22" class="box"/>
  <text x="105" y="210" class="label">명세 · 무엇을 해야 하는가</text>
  <rect x="110" y="260" width="310" height="300" class="box"/>
  <rect x="110" y="260" width="310" height="60" class="shade"/>
  <g class="body" text-anchor="middle"><text x="160" y="300">A</text><text x="265" y="300">B</text><text x="370" y="300">Y</text><text x="160" y="365">0</text><text x="265" y="365">0</text><text x="370" y="365">0</text><text x="160" y="425">0</text><text x="265" y="425">1</text><text x="370" y="425">0</text><text x="160" y="485">1</text><text x="265" y="485">0</text><text x="370" y="485">0</text><text x="160" y="545">1</text><text x="265" y="545">1</text><text x="370" y="545">1</text></g>
  <g stroke="#222" stroke-width="2"><line x1="210" y1="260" x2="210" y2="560"/><line x1="320" y1="260" x2="320" y2="560"/><line x1="110" y1="320" x2="420" y2="320"/><line x1="110" y1="380" x2="420" y2="380"/><line x1="110" y1="440" x2="420" y2="440"/><line x1="110" y1="500" x2="420" y2="500"/></g>
  <text x="265" y="620" text-anchor="middle" class="body">AND의 출력 관계</text>
  <path d="M470 435 H600" class="line" marker-end="url(#arrow)"/>
  <rect x="495" y="360" width="105" height="105" rx="52" class="shade"/>
  <text x="548" y="402" text-anchor="middle" class="small">같은</text><text x="548" y="426" text-anchor="middle" class="small">마지막 열</text>

  <rect x="620" y="165" width="710" height="540" rx="22" class="box"/>
  <text x="655" y="210" class="label">구현 · 어떻게 만들 것인가</text>
  <text x="675" y="330" class="body">A</text><text x="675" y="510" class="body">B</text>
  <line x1="710" y1="325" x2="790" y2="325" stroke="#222" stroke-width="3"/><line x1="710" y1="505" x2="790" y2="505" stroke="#222" stroke-width="3"/>
  <rect x="790" y="300" width="190" height="230" rx="20" class="shade"/>
  <text x="885" y="400" text-anchor="middle" class="label">NAND 1</text><text x="885" y="430" text-anchor="middle" class="small">N = NAND(A,B)</text>
  <path d="M980 415 H1060" class="line" marker-end="url(#arrow)"/>
  <text x="1018" y="397" text-anchor="middle" class="small">N</text>
  <path d="M1030 415 V365 H1060" fill="none" stroke="#222" stroke-width="3"/>
  <path d="M1030 415 V465 H1060" fill="none" stroke="#222" stroke-width="3"/>
  <rect x="1060" y="330" width="190" height="170" rx="20" class="shade"/>
  <text x="1155" y="400" text-anchor="middle" class="label">NAND 2</text><text x="1155" y="430" text-anchor="middle" class="small">NOT(N)</text>
  <path d="M1250 415 H1300" class="line" marker-end="url(#arrow)"/><text x="1275" y="392" text-anchor="middle" class="body">Y</text>
  <text x="975" y="585" text-anchor="middle" class="body">NAND 2개 · 가장 긴 경로 2층</text>

  <rect x="70" y="755" width="1260" height="72" rx="14" class="dash"/>
  <text x="700" y="785" text-anchor="middle" class="body">접어 둔 층: 전압 · 트랜지스터 · 공정</text>
  <text x="700" y="810" text-anchor="middle" class="small">이 장에서는 진리표와 논리 게이트의 경계까지만 연다</text>
  <g fill="#222"><polygon points="600,435 590,430 590,440"/><polygon points="1060,415 1050,410 1050,420"/><polygon points="1300,415 1290,410 1290,420"/></g>
</svg>
