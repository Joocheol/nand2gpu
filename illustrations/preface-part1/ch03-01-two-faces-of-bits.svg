<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker><style>.title{font:700 34px sans-serif;fill:#111}.sub{font:500 19px sans-serif;fill:#444}.label{font:700 22px sans-serif;fill:#111}.body{font:500 19px sans-serif;fill:#222}.small{font:500 15px sans-serif;fill:#555}.equation{font-family:serif;font-size:42px;font-weight:700;fill:#111}.box{fill:#fff;stroke:#222;stroke-width:2}.shade{fill:#e7e7e7;stroke:#222;stroke-width:2}.line{stroke:#222;stroke-width:3;fill:none}</style></defs>
  <rect width="1400" height="900" fill="#fff"/>
  <text x="70" y="72" class="title">같은 비트열도 어떤 수로 읽을지는 표현 규약이 정한다</text>
  <text x="70" y="106" class="sub">3장 도해 1 · 논리값과 자릿값, 무부호와 2의 보수</text>
  <text x="70" y="175" class="label">위: 논리값</text>
  <g text-anchor="middle" class="label"><rect x="270" y="135" width="150" height="85" rx="14" class="box"/><text x="345" y="188">1</text><rect x="440" y="135" width="150" height="85" rx="14" class="box"/><text x="515" y="188">0</text><rect x="610" y="135" width="150" height="85" rx="14" class="box"/><text x="685" y="188">0</text><rect x="780" y="135" width="150" height="85" rx="14" class="box"/><text x="855" y="188">0</text></g>
  <text x="70" y="300" class="label">아래: 자릿값</text>
  <g text-anchor="middle"><rect x="270" y="260" width="150" height="90" rx="14" class="shade"/><text x="345" y="302" class="label">8</text><text x="345" y="330" class="small">2³ 자리</text><rect x="440" y="260" width="150" height="90" rx="14" class="shade"/><text x="515" y="302" class="label">4</text><text x="515" y="330" class="small">2² 자리</text><rect x="610" y="260" width="150" height="90" rx="14" class="shade"/><text x="685" y="302" class="label">2</text><text x="685" y="330" class="small">2¹ 자리</text><rect x="780" y="260" width="150" height="90" rx="14" class="shade"/><text x="855" y="302" class="label">1</text><text x="855" y="330" class="small">2⁰ 자리</text></g>
  <path d="M600 350 V470 H350 V500" class="line" marker-end="url(#arrow)"/><path d="M600 350 V470 H1050 V500" class="line" marker-end="url(#arrow)"/>
  <rect x="110" y="500" width="560" height="240" rx="22" class="box"/>
  <text x="390" y="548" text-anchor="middle" class="label">무부호 정수로 읽기</text>
  <text x="390" y="620" text-anchor="middle" class="equation">1000₂ = 8</text>
  <text x="390" y="670" text-anchor="middle" class="body">범위 0 ~ 15</text>
  <text x="390" y="704" text-anchor="middle" class="small">맨 왼쪽 자리도 +8의 자릿값</text>
  <rect x="730" y="500" width="560" height="240" rx="22" class="shade"/>
  <text x="1010" y="548" text-anchor="middle" class="label">4비트 2의 보수로 읽기</text>
  <text x="1010" y="620" text-anchor="middle" class="equation">1000₂ = −8</text>
  <text x="1010" y="670" text-anchor="middle" class="body">범위 −8 ~ 7</text>
  <text x="1010" y="704" text-anchor="middle" class="small">같은 비트열, 다른 수 해석</text>
  <text x="70" y="828" class="body">비트열 · 수의 해석 · 회로 결과는 서로 다른 층이다.</text>
  <g fill="#222"><polygon points="350,500 345,490 355,490"/><polygon points="1050,500 1045,490 1055,490"/></g>
</svg>
