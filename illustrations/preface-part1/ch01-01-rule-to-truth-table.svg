<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs><style>.title{font:700 34px sans-serif;fill:#111}.sub{font:500 19px sans-serif;fill:#444}.label{font:700 21px sans-serif;fill:#111}.body{font:500 18px sans-serif;fill:#222}.small{font:500 15px sans-serif;fill:#555}.box{fill:#fff;stroke:#222;stroke-width:2}.shade{fill:#e9e9e9;stroke:#222;stroke-width:2}.grid{stroke:#222;stroke-width:2}</style></defs>
  <rect width="1400" height="900" fill="#fff"/>
  <text x="70" y="72" class="title">일상 규칙의 모든 경우를 적으면 진리표가 된다</text>
  <text x="70" y="106" class="sub">1장 도해 1 · 안전 덮개 A, 시작 단추 B, 모터 허가 Y</text>
  <rect x="70" y="155" width="420" height="590" rx="22" class="shade"/>
  <text x="105" y="205" class="label">단순화한 규칙</text>
  <text x="105" y="265" class="body">안전 덮개가 닫혀 있고</text>
  <text x="105" y="300" class="body">시작 단추가 눌렸을 때만</text>
  <text x="105" y="335" class="body">모터 작동을 허가한다.</text>
  <g class="small"><text x="105" y="420">A = 안전 덮개</text><text x="105" y="455">B = 시작 단추</text><text x="105" y="490">Y = 모터 허가</text></g>
  <rect x="105" y="555" width="350" height="115" rx="14" class="box"/>
  <text x="280" y="600" text-anchor="middle" class="body">둘 다 1일 때만 Y = 1</text>
  <text x="280" y="638" text-anchor="middle" class="small">실제 안전회로가 아닌 교육용 모형</text>

  <text x="565" y="205" class="label">질문 순서대로 네 경우를 빠짐없이 채운다</text>
  <rect x="565" y="245" width="750" height="430" class="box"/>
  <rect x="565" y="245" width="500" height="70" class="shade"/><rect x="1065" y="245" width="250" height="70" class="box"/>
  <g class="label" text-anchor="middle"><text x="690" y="290">A</text><text x="940" y="290">B</text><text x="1190" y="290">Y = A AND B</text></g>
  <g class="body" text-anchor="middle">
    <text x="690" y="365">0</text><text x="940" y="365">0</text><text x="1190" y="365">0</text>
    <text x="690" y="455">0</text><text x="940" y="455">1</text><text x="1190" y="455">0</text>
    <text x="690" y="545">1</text><text x="940" y="545">0</text><text x="1190" y="545">0</text>
    <text x="690" y="635">1</text><text x="940" y="635">1</text><text x="1190" y="635">1</text>
  </g>
  <g class="small" text-anchor="end"><text x="550" y="365">①</text><text x="550" y="455">②</text><text x="550" y="545">③</text><text x="550" y="635">④</text></g>
  <g class="grid"><line x1="815" y1="245" x2="815" y2="675"/><line x1="1065" y1="245" x2="1065" y2="675"/><line x1="565" y1="315" x2="1315" y2="315"/><line x1="565" y1="405" x2="1315" y2="405"/><line x1="565" y1="495" x2="1315" y2="495"/><line x1="565" y1="585" x2="1315" y2="585"/></g>
  <rect x="565" y="715" width="750" height="80" rx="14" class="shade"/>
  <text x="940" y="748" text-anchor="middle" class="body">입력 2개 → 가능한 경우 2² = 4행</text>
  <text x="940" y="776" text-anchor="middle" class="small">네 행을 모두 적으면 입력 조합을 빠뜨리지 않는다.</text>
</svg>
