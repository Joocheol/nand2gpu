<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#222"/></marker>
    <style>.title{font:700 34px sans-serif;fill:#111}.sub{font:500 19px sans-serif;fill:#444}.label{font:700 21px sans-serif;fill:#111}.body{font:500 17px sans-serif;fill:#222}.small{font:500 14px sans-serif;fill:#555}.box{fill:#fff;stroke:#222;stroke-width:2}.shade{fill:#e8e8e8;stroke:#222;stroke-width:2}.line{stroke:#222;stroke-width:3;fill:none}</style>
  </defs>
  <rect width="1400" height="900" fill="#fff"/>
  <text x="70" y="72" class="title">계산을 내려가 이해하고, 다시 올라가 배치한다</text>
  <text x="70" y="106" class="sub">서장 도해 2 · 역사 연표가 아닌 설명의 두 길</text>

  <rect x="70" y="160" width="400" height="630" rx="24" class="box"/>
  <text x="105" y="208" class="label">내려가는 길 · 작은 규칙을 찾는다</text>
  <g text-anchor="middle">
    <rect x="125" y="255" width="290" height="78" rx="14" class="shade"/><text x="270" y="288" class="body">행렬의 한 칸</text><text x="270" y="313" class="small">계산법은 16장에서 완결</text>
    <path d="M270 334 V374" class="line" marker-end="url(#arrow)"/>
    <rect x="125" y="382" width="290" height="68" rx="14" class="box"/><text x="270" y="424" class="body">더 작은 산술</text>
    <path d="M270 451 V491" class="line" marker-end="url(#arrow)"/>
    <rect x="125" y="499" width="290" height="68" rx="14" class="box"/><text x="270" y="541" class="body">이진 덧셈</text>
    <path d="M270 568 V608" class="line" marker-end="url(#arrow)"/>
    <rect x="125" y="616" width="290" height="92" rx="14" class="shade"/><text x="270" y="654" class="body">진리표</text><text x="270" y="680" class="small">본문 1장의 실제 출발점</text>
  </g>

  <rect x="530" y="160" width="800" height="630" rx="24" class="box"/>
  <text x="565" y="208" class="label">올라오는 길 · 유한한 자원에 배치한다</text>
  <g text-anchor="middle">
    <rect x="575" y="260" width="205" height="92" rx="14" class="shade"/><text x="678" y="294" class="body">1 · 명세</text><text x="678" y="322" class="small">진리표 · 1장</text>
    <path d="M780 306 H825" class="line" marker-end="url(#arrow)"/>
    <rect x="835" y="260" width="205" height="92" rx="14" class="box"/><text x="938" y="294" class="body">2 · 조합</text><text x="938" y="322" class="small">덧셈·곱셈·ALU · 2~5장</text>
    <path d="M1040 306 H1085" class="line" marker-end="url(#arrow)"/>
    <rect x="1095" y="260" width="190" height="92" rx="14" class="box"/><text x="1190" y="294" class="body">3 · 시간적 재사용</text><text x="1190" y="322" class="small">상태·명령 · 6~7장</text>

    <path d="M1190 353 V420" class="line" marker-end="url(#arrow)"/>
    <rect x="1085" y="430" width="210" height="105" rx="14" class="shade"/><text x="1190" y="466" class="body">4 · 복제·공유</text><text x="1190" y="494" class="small">병렬 실행 · GPU</text><text x="1190" y="517" class="small">8~12장</text>
    <path d="M1085 482 H1040" class="line" marker-end="url(#arrow)"/>
    <rect x="815" y="430" width="215" height="105" rx="14" class="box"/><text x="922" y="466" class="body">5 · 데이터 재사용</text><text x="922" y="494" class="small">메모리·타일링</text><text x="922" y="517" class="small">13~17장</text>
    <path d="M815 482 H770" class="line" marker-end="url(#arrow)"/>
    <rect x="565" y="430" width="195" height="105" rx="14" class="box"/><text x="662" y="466" class="body">6 · 전용화</text><text x="662" y="494" class="small">행렬 경로·AI 가속기</text><text x="662" y="517" class="small">18~20장</text>
  </g>
  <rect x="575" y="625" width="710" height="96" rx="16" class="shade"/>
  <text x="930" y="662" text-anchor="middle" class="body">같은 답을 지키면서 무엇을 조합·복제·공유·재사용·전용화할 것인가</text>
  <text x="930" y="695" text-anchor="middle" class="small">각 단계는 필연적 역사 순서가 아니라 이 책이 비용을 비교하는 설명 순서다</text>
  <text x="70" y="842" class="small">두 패널은 역사 순서가 아니라 계산을 이해하는 두 설명 방향을 나타낸다.</text>
  <g fill="#222"><polygon points="270,374 265,364 275,364"/><polygon points="270,491 265,481 275,481"/><polygon points="270,608 265,598 275,598"/><polygon points="825,306 815,301 815,311"/><polygon points="1085,306 1075,301 1075,311"/><polygon points="1190,420 1185,410 1195,410"/><polygon points="1040,482 1050,477 1050,487"/><polygon points="770,482 780,477 780,487"/></g>
</svg>
